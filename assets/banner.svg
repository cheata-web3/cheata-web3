<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="CheatA Web3 Browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#0f1736"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <style>
      .pulse { animation: p 3s ease-in-out infinite; }
      .n2 { animation-delay: 1s; } .n3 { animation-delay: 2s; }
      @keyframes p { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>

  <!-- chain of blocks -->
  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <line x1="866" y1="160" x2="924" y2="160" stroke-dasharray="4 6"/>
    <line x1="1006" y1="160" x2="1064" y2="160" stroke-dasharray="4 6"/>
  </g>
  <g class="pulse"><rect x="786" y="120" width="80" height="80" rx="12" fill="#111c3d" stroke="#60a5fa" stroke-width="2"/><text x="826" y="167" text-anchor="middle" class="m" font-size="16" fill="#93c5fd">2018</text></g>
  <g class="pulse n2"><rect x="926" y="120" width="80" height="80" rx="12" fill="#111c3d" stroke="#a78bfa" stroke-width="2"/><text x="966" y="167" text-anchor="middle" class="m" font-size="16" fill="#c4b5fd">MP</text></g>
  <g class="pulse n3"><rect x="1066" y="120" width="80" height="80" rx="12" fill="#111c3d" stroke="#22d3ee" stroke-width="2"/><text x="1106" y="167" text-anchor="middle" class="m" font-size="16" fill="#67e8f9">NOW</text></g>

  <text x="64" y="118" class="m" font-size="18" fill="#64748b">// cheata-web3</text>
  <text x="62" y="190" class="t" font-size="76" font-weight="800" fill="url(#txt)">CheatA</text>
  <text x="64" y="234" class="t" font-size="26" fill="#e2e8f0">Web3 Browser  ·  MP Wallet  ·  DEX  ·  DApps Builder</text>
  <text x="64" y="272" class="m" font-size="16" fill="#94a3b8">MP on Ethereum Mainnet since block 5,727,601 (2018-06-03)</text>
</svg>
